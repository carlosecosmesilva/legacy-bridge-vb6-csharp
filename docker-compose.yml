version: '3.8'

services:
  db:
    image: postgres:15
    container_name: legacy-bridge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legacy_bridge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Db/legacy/002_create_customers_table.sql:/docker-entrypoint-initdb.d/002_create_customers_table.sql:ro
      - ./Db/legacy/003_create_products_table.sql:/docker-entrypoint-initdb.d/003_create_products_table.sql:ro
      - ./Db/legacy/004_create_search_function.sql:/docker-entrypoint-initdb.d/004_create_search_function.sql:ro
      - ./Db/legacy/005_inserts_schema.sql:/docker-entrypoint-initdb.d/005_inserts_schema.sql:ro
    networks:
      - legacy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacy_bridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/LegacyBridge.Api/Dockerfile
    container_name: legacy-bridge-api
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=postgres;Password=postgres;Database=legacy_bridge_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/LegacyBridge.Api/Logs:/app/Logs
    networks:
      - legacy-network
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: services/MonitorService/Dockerfile
    container_name: legacy-bridge-monitor
    environment:
      - DOTNET_ENVIRONMENT=Development
      - FileWatcher__MonitorPath=/app/monitor
      - FileWatcher__LogPath=/app/logs
    volumes:
      - ./services/MonitorService/Logs:/app/logs
      - ./monitor:/app/monitor
    networks:
      - legacy-network
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  legacy-network:
    driver: bridge
