name: CI

on:
    push:
        branches: [main, develop, feature/**]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    SOLUTION_FILE: LegacyBridge.sln

jobs:
    build_and_test:
        name: Build and Unit Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore
              run: dotnet restore $SOLUTION_FILE

            - name: Build
              run: dotnet build $SOLUTION_FILE --configuration Release --no-restore

            - name: Test (with coverage)
              run: dotnet test $SOLUTION_FILE --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx

            - name: Publish Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: |
                      **/TestResults/*.trx
                      **/TestResults/**/coverage.cobertura.xml

    integration_smoke:
        name: Integration Smoke (Docker Compose)
        runs-on: ubuntu-latest
        needs: build_and_test

        services: {}

        env:
            COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Up (db + api)
              run: |
                  docker compose -f docker-compose.yml build db api
                  docker compose -f docker-compose.yml up -d db api

            - name: Wait for API health
              run: bash scripts/ci/wait-for-url.sh http://localhost:5000/health 90

            - name: API Smoke Tests
              run: bash scripts/ci/smoke-api.sh

            - name: Compose logs (on failure)
              if: failure()
              run: |
                  docker compose -f docker-compose.yml ps
                  docker compose -f docker-compose.yml logs --no-color db api | tail -n 300

            - name: Down
              if: always()
              run: docker compose -f docker-compose.yml down -v

    docker_build:
        name: Build Docker Images
        runs-on: ubuntu-latest
        needs: [build_and_test]
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build API Image
              run: docker build -f server/LegacyBridge.Api/Dockerfile -t legacy-bridge-api:ci .

            - name: Build Monitor Image
              run: docker build -f services/MonitorService/Dockerfile -t legacy-bridge-monitor:ci .

            # Optional push to registry (configure your secrets and uncomment)
